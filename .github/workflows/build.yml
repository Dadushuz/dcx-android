name: Build DCX v8 Glass APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Extract ZIP and DELETE old white UI screens
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -q -o "$z"
            fi
          done
          if [ -d "dcx-android" ]; then
            cp -rf dcx-android/. .
            rm -rf dcx-android
          fi
          rm -rf .kotlin
          find . -name "*.salive" -type f -delete

          # ESKI OQ EKRANLI BARCHA KOTLIN FAYLLARINI BUTUNLAY O'CHIRISH:
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/ui
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/data
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/domain
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/di
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/sync

      - name: 3. Move index1.html into Android Assets (1-to-1)
        run: |
          mkdir -p app/src/main/assets
          if [ -f "index1.html" ]; then
            cp index1.html app/src/main/assets/index.html
          elif [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "XATOLIK: index1.html fayli repozitoriyga yuklanmagan!"
            exit 1
          fi

          # index1.html ichidagi media-guard blokini olib tashlash va net()/forceSync() ni ulash
          python3 - << ' PYEOF'
          p = "app/src/main/assets/index.html"
          with open(p, "r", encoding="utf-8") as f:
              html = f.read()

          import re
          html = re.sub(r'<script data-tmly-media-guard="1">.*?</script>', '', html, flags=re.S)

          patch = """<script>
          function net(on){
            var e=document.getElementById("net");
            if(!e)return;
            var ok=on&&navigator.onLine!==false;
            e.className="net-bar "+(ok?"net-online":"net-offline");
            e.textContent=ok?"🟢 ОНЛАЙН":"🔴 ОФФЛАЙН — НЕТ СВЯЗИ С СЕРВЕРОМ";
          }
          async function forceSync(){
            if(typeof toast==="function")toast("☁️ Синхронизация…");
            if(typeof flush==="function")await flush();
            if(typeof connect==="function")await connect();
            if(typeof syncClock==="function")await syncClock();
            if(typeof toast==="function")toast("✅ Синхронизировано");
          }
          window.addEventListener("online",function(){net(true);if(typeof poll==="function")poll();});
          window.addEventListener("offline",function(){net(false);if(typeof beep==="function")beep(300,0.5);});
          """
          html = html.replace("<script>", patch, 1)
          with open(p, "w", encoding="utf-8") as f:
              f.write(html)
          PYEOF

      - name: 4. Write Clean DcxApp and MainActivity
        run: |
          cat << 'EOF' > app/src/main/java/uz/metro/chilonzor/dcxduty/DcxApp.kt
          package uz.metro.chilonzor.dcxduty
          import android.app.Application
          class DcxApp : Application()
          EOF

          cat << 'EOF' > app/src/main/java/uz/metro/chilonzor/dcxduty/MainActivity.kt
          package uz.metro.chilonzor.dcxduty

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Color.parseColor("#0f172a")
                  window.navigationBarColor = Color.parseColor("#020617")

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#0f172a"))
                      setLayerType(View.LAYER_TYPE_HARDWARE, null)
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          allowFileAccess = true
                          allowContentAccess = true
                          @Suppress("DEPRECATION")
                          allowUniversalAccessFromFileURLs = true
                          @Suppress("DEPRECATION")
                          allowFileAccessFromFileURLs = true
                          mediaPlaybackRequiresUserGesture = false
                          cacheMode = WebSettings.LOAD_DEFAULT
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                          setSupportZoom(false)
                      }
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                      loadUrl("file:///android_asset/index.html")
                  }

                  setContentView(webView)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack()
                      }
                  })
              }
          }
          EOF

      - name: 5. Set up JDK 17 & Build APK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 6. Compile New APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Chilonzor-DCH-v8-NEW.apk

      - name: 7. Upload NEW APK
        uses: actions/upload-artifact@v4
        with:
          name: NEW-Chilonzor-v8-APK
          path: Chilonzor-DCH-v8-NEW.apk
