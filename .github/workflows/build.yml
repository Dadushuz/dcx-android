name: Build DCX Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if uploaded as archive
        run: |
          if [ -f "dcx-android-fixed.zip" ]; then
            unzip -q -o dcx-android-fixed.zip
          fi
          if [ -d "dcx-android" ]; then
            cp -r dcx-android/* .
            rm -rf dcx-android/.kotlin
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: dcx-chilonzor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
