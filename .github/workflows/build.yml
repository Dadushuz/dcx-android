name: Build Modular DU-58 Desktop APK (Smart OTA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Extract Android Shell and Clean Old UI
        run: |
          for z in *.zip; do
            if [ -f "$z" ] && [ "$z" != "DU58_Modular_Files.zip" ]; then
              unzip -q -o "$z"
            fi
          done
          if [ -d "dcx-android" ]; then
            cp -rf dcx-android/. .
            rm -rf dcx-android
          fi
          rm -rf .kotlin
          find . -name "*.salive" -type f -delete
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/ui
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/data
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/domain
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/di
          rm -rf app/src/main/java/uz/metro/chilonzor/dcxduty/sync

      - name: 3. Copy Modular Files to Assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html style.css config.js stamps.js app.js app/src/main/assets/

      - name: 4. Write Smart OTA MainActivity (Auto-Syncs 5 Files from GitHub)
        run: |
          python3 -c 'import pathlib; pathlib.Path("app/src/main/java/uz/metro/chilonzor/dcxduty/DcxApp.kt").write_text("package uz.metro.chilonzor.dcxduty\nimport android.app.Application\nclass DcxApp : Application()\n","utf-8")'
          python3 -c 'import pathlib; code="package uz.metro.chilonzor.dcxduty\n\nimport android.annotation.SuppressLint\nimport android.content.ContentValues\nimport android.content.Context\nimport android.graphics.Color\nimport android.os.Build\nimport android.os.Bundle\nimport android.os.Environment\nimport android.print.PrintAttributes\nimport android.print.PrintManager\nimport android.provider.MediaStore\nimport android.view.View\nimport android.view.WindowManager\nimport android.webkit.JavascriptInterface\nimport android.webkit.WebChromeClient\nimport android.webkit.WebResourceRequest\nimport android.webkit.WebSettings\nimport android.webkit.WebView\nimport android.webkit.WebViewClient\nimport android.widget.FrameLayout\nimport android.widget.Toast\nimport androidx.activity.ComponentActivity\nimport androidx.activity.OnBackPressedCallback\nimport java.io.File\nimport java.net.HttpURLConnection\nimport java.net.URL\n\nclass MainActivity : ComponentActivity() {\n    private lateinit var webView: WebView\n    private val otaFiles = listOf(\"index.html\", \"style.css\", \"config.js\", \"stamps.js\", \"app.js\")\n    private val githubRawBase = \"https://raw.githubusercontent.com/Dadushuz/dcx-android/main/\"\n\n    @SuppressLint(\"SetJavaScriptEnabled\")\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)\n        window.statusBarColor = Color.parseColor(\"#090d16\")\n        window.navigationBarColor = Color.parseColor(\"#090d16\")\n\n        val sbId = resources.getIdentifier(\"status_bar_height\", \"dimen\", \"android\")\n        val topPad = if (sbId > 0) resources.getDimensionPixelSize(sbId) + 8 else 88\n        val nbId = resources.getIdentifier(\"navigation_bar_height\", \"dimen\", \"android\")\n        val botPad = if (nbId > 0) resources.getDimensionPixelSize(nbId) else 32\n\n        val otaDir = File(filesDir, \"ota\")\n        if (!otaDir.exists()) otaDir.mkdirs()\n        ensureInitialOtaFiles(otaDir)\n\n        webView = WebView(this).apply {\n            setBackgroundColor(Color.parseColor(\"#0f172a\"))\n            setLayerType(View.LAYER_TYPE_HARDWARE, null)\n            isHorizontalScrollBarEnabled = false\n            settings.apply {\n                javaScriptEnabled = true\n                domStorageEnabled = true\n                databaseEnabled = true\n                allowFileAccess = true\n                allowContentAccess = true\n                @Suppress(\"DEPRECATION\")\n                allowUniversalAccessFromFileURLs = true\n                @Suppress(\"DEPRECATION\")\n                allowFileAccessFromFileURLs = true\n                mediaPlaybackRequiresUserGesture = false\n                cacheMode = WebSettings.LOAD_NO_CACHE\n                mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW\n                useWideViewPort = true\n                loadWithOverviewMode = true\n                setSupportZoom(false)\n                builtInZoomControls = false\n                displayZoomControls = false\n            }\n            webViewClient = object : WebViewClient() {\n                override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean = false\n            }\n            webChromeClient = WebChromeClient()\n            addJavascriptInterface(AndroidBridge(), \"AndroidBridge\")\n            loadUrl(\"file://${otaDir.absolutePath}/index.html\")\n        }\n\n        val root = FrameLayout(this).apply {\n            setBackgroundColor(Color.parseColor(\"#090d16\"))\n            setPadding(0, topPad, 0, botPad)\n            addView(webView, FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT))\n        }\n\n        setContentView(root)\n\n        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {\n            override fun handleOnBackPressed() {\n                if (webView.canGoBack()) webView.goBack()\n            }\n        })\n\n        syncOtaFromGitHub(otaDir, false)\n    }\n\n    private fun ensureInitialOtaFiles(otaDir: File) {\n        for (name in otaFiles) {\n            val target = File(otaDir, name)\n            if (!target.exists()) {\n                try {\n                    assets.open(name).use { input ->\n                        target.outputStream().use { output -> input.copyTo(output) }\n                    }\n                } catch (_: Exception) {}\n            }\n        }\n    }\n\n    private fun syncOtaFromGitHub(otaDir: File, manual: Boolean) {\n        Thread {\n            var updated = false\n            try {\n                for (name in otaFiles) {\n                    val url = URL(\"$githubRawBase$name?t=${System.currentTimeMillis()}\")\n                    val conn = (url.openConnection() as HttpURLConnection).apply {\n                        connectTimeout = 6000\n                        readTimeout = 6000\n                        useCaches = false\n                    }\n                    if (conn.responseCode == 200) {\n                        val newBytes = conn.inputStream.use { it.readBytes() }\n                        val target = File(otaDir, name)\n                        val oldBytes = if (target.exists()) target.readBytes() else ByteArray(0)\n                        if (newBytes.isNotEmpty() && !newBytes.contentEquals(oldBytes)) {\n                            target.writeBytes(newBytes)\n                            updated = true\n                        }\n                    }\n                    conn.disconnect()\n                }\n            } catch (_: Exception) {}\n\n            if (updated) {\n                runOnUiThread {\n                    webView.clearCache(true)\n                    webView.loadUrl(\"file://${otaDir.absolutePath}/index.html?v=${System.currentTimeMillis()}\")\n                    Toast.makeText(this@MainActivity, \"✅ Обновление из GitHub загружено!\", Toast.LENGTH_SHORT).show()\n                }\n            } else if (manual) {\n                runOnUiThread {\n                    Toast.makeText(this@MainActivity, \"✓ Установлена последняя версия\", Toast.LENGTH_SHORT).show()\n                }\n            }\n        }.start()\n    }\n\n    inner class AndroidBridge {\n        @JavascriptInterface\n        fun checkUpdates() {\n            syncOtaFromGitHub(File(filesDir, \"ota\"), true)\n        }\n\n        @JavascriptInterface\n        fun printPage(jobName: String) {\n            runOnUiThread {\n                val pm = getSystemService(Context.PRINT_SERVICE) as? PrintManager ?: return@runOnUiThread\n                val adapter = webView.createPrintDocumentAdapter(jobName)\n                pm.print(jobName, adapter, PrintAttributes.Builder().build())\n            }\n        }\n\n        @JavascriptInterface\n        fun saveCsv(fileName: String, content: String) {\n            try {\n                val bytes = content.toByteArray(Charsets.UTF_8)\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {\n                    val values = ContentValues().apply {\n                        put(MediaStore.Downloads.DISPLAY_NAME, fileName)\n                        put(MediaStore.Downloads.MIME_TYPE, \"text/csv\")\n                        put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)\n                    }\n                    val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)\n                    if (uri != null) {\n                        contentResolver.openOutputStream(uri)?.use { it.write(bytes) }\n                    }\n                } else {\n                    @Suppress(\"DEPRECATION\")\n                    val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)\n                    File(dir, fileName).writeBytes(bytes)\n                }\n            } catch (_: Exception) {}\n        }\n    }\n}\n"; pathlib.Path("app/src/main/java/uz/metro/chilonzor/dcxduty/MainActivity.kt").write_text(code,"utf-8")'

      - name: 5. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 6. Compile APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Chilonzor-DU58-Desktop.apk

      - name: 7. Upload APK without compression
        uses: actions/upload-artifact@v4
        with:
          name: Chilonzor-DU58-Desktop-APK
          path: Chilonzor-DU58-Desktop.apk
          compression-level: 0
